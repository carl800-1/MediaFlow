version: '3.8'

services:
  mediaflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mediaflow
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../config:/app/config
    environment:
      - MEDIAFLOW_CONFIG=/app/config/config.yaml
      - MEDIAFLOW_PORT=3000
      - MEDIAFLOW_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mediaflow-network

networks:
  mediaflow-network:
    driver: bridge

version: '3.8'

services:
  mediaflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediaflow
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # 配置文件目录
      - ./config:/app/config
      # 数据目录
      - ./data:/app/data
      # 日志目录
      - ./logs:/app/logs
      # 媒体库目录（根据你的实际路径修改）
      - /path/to/media:/media
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - NASTOOL_CONFIG=/app/config/config.yaml
      - MEDIAFLOW_CONFIG=/app/config
      - MEDIAFLOW_DATA=/app/data
    networks:
      - mediaflow-network

networks:
  mediaflow-network:
    driver: bridge

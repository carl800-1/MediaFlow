name: Docker Branch Test

# ============================================================
# 分支测试镜像构建
#
# 触发条件:
#   - push 到 feature/*, bugfix/*, hotfix/* 分支
#   - 手动触发
#
# 镜像标签:
#   branch-{branch-name}: 分支测试镜像
#   branch-{branch-name}-{sha}: 精确版本
# ============================================================

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
  workflow_dispatch:
    inputs:
      branch:
        description: '指定分支名'
        required: false
        default: ''
        type: string
      push_latest:
        description: '同时推送 latest 标签'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERFILE: ./docker/Dockerfile

jobs:
  build-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # --------------------------------------------------
      # 1. 检出代码
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. 解析分支信息
      # --------------------------------------------------
      - name: Resolve branch info
        id: branch
        run: |
          if [[ -n "${{ github.event.inputs.branch }}" ]]; then
            BRANCH_NAME="${{ github.event.inputs.branch }}"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          fi
          
          # 清理分支名（替换 / 为 -）
          SAFE_BRANCH="${BRANCH_NAME//\//-}"
          echo "name=$SAFE_BRANCH" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # --------------------------------------------------
      # 3. 设置 QEMU 和 Buildx
      # --------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------
      # 4. 登录 GHCR
      # --------------------------------------------------
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # 5. 生成镜像标签
      # --------------------------------------------------
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 分支标签: branch-{name}
            type=raw,value=branch-${{ steps.branch.outputs.name }}
            # 精确版本: branch-{name}-{sha}
            type=raw,value=branch-${{ steps.branch.outputs.name }}-${{ steps.branch.outputs.short_sha }}
            # 可选 latest
            type=raw,value=latest,enable=${{ github.event.inputs.push_latest == 'true' }}

      # --------------------------------------------------
      # 6. 构建并推送
      # --------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.workflow }}-${{ steps.branch.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ steps.branch.outputs.name }}

      # --------------------------------------------------
      # 7. 输出镜像信息
      # --------------------------------------------------
      - name: Image info
        run: |
          echo "✅ 分支测试镜像构建完成"
          echo ""
          echo "📦 镜像标签:"
          echo "   ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:branch-${{ steps.branch.outputs.name }}"
          echo "   ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:branch-${{ steps.branch.outputs.name }}-${{ steps.branch.outputs.short_sha }}"
          echo ""
          echo "🔧 测试命令:"
          echo "   docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:branch-${{ steps.branch.outputs.name }}"
          echo "   docker run -d -p 3000:3000 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:branch-${{ steps.branch.outputs.name }}"

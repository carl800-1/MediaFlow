name: Build Docker Test Image

# ============================================================
# 分支/PR 测试镜像构建
#
# 触发场景：
#   1. PR 到 main 分支 → 构建并推送 `pr-{number}:latest`
#   2. 推送任意非 main 分支 → 构建并推送 `branch-{name}:latest`
#
# 用途：
#   - 分支开发者可拉取 `pr-123:latest` 进行自动化测试
#   - 功能分支可拉取 `branch-{name}:latest` 进行集成验证
#   - 所有测试镜像均不带 latest（避免与主分支 latest 混淆）
# ============================================================

on:
  # PR 到 main 时触发（PR 创建 + 后续每次 push 到该 PR 分支）
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

  # 推送任意非 main 分支时触发（开发中功能分支测试）
  push:
    branches:
      - '**'
      - '!main'

  # 手动触发（用于补刷历史提交或调试）
  workflow_dispatch:
    inputs:
      branch_name:
        description: '指定分支名（留空则用当前分支）'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: carl800-1/mediaflow

jobs:
  build-test-image:
    runs-on: ubuntu-latest
    name: Build Test Image
    permissions:
      contents: read
      packages: write

    steps:
      # --------------------------------------------------
      # 1. 拉取代码
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. 解析镜像标签
      # --------------------------------------------------
      - name: Resolve image tag
        id: tag
        run: |
          # 确定镜像标签名
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # PR 场景：使用 pr-{number} 作为标签
            TAG_NAME="pr-${GITHUB_REF#refs/pull/}"
            TAG_NAME="${TAG_NAME%/merge}"  # 去除尾部的 /merge
            echo "image_tag=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "suffix=PR #${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && [[ -n "${{ inputs.branch_name }}" ]]; then
            # 手动触发指定分支
            TAG_NAME="branch-${{ inputs.branch_name }}"
            echo "image_tag=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "suffix=手动分支 ${{ inputs.branch_name }}" >> $GITHUB_OUTPUT
          else
            # 推送非 main 分支场景
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            # 标签名：替换 / 为 -，去除非法字符
            TAG_NAME="branch-${BRANCH_NAME//\//-}"
            TAG_NAME="${TAG_NAME//[^a-zA-Z0-9_-]/-}"  # 只允许字母数字中划线
            echo "image_tag=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "suffix=分支 ${BRANCH_NAME}" >> $GITHUB_OUTPUT
          fi

          # 完整镜像标签（含 SHA）
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "image_tag_with_sha=${TAG_NAME}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "commit_msg=$(git log -1 --pretty=%B | head -1 | cut -c1-80)" >> $GITHUB_OUTPUT

      # --------------------------------------------------
      # 3. 构建 metadata（镜像标签列表）
      # --------------------------------------------------
      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 主标签：{branch-name}:latest  （用于测试，拉取最新）
            type=raw,value=${{ steps.tag.outputs.image_tag }}
            # 备用标签：{branch-name}-{sha7}  （精确回溯）
            type=raw,value=${{ steps.tag.outputs.image_tag_with_sha }}
            # 额外标签：PR 场景额外加上 pr-{number} 纯数字标签（兼容旧工具）
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}

      # --------------------------------------------------
      # 4. 设置 QEMU（多平台支持，预留）
      # --------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------
      # 5. 登录 GHCR
      # --------------------------------------------------
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # 6. 构建并推送
      # --------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          # 测试镜像只构建 amd64，加速 CI
          # 如需 ARM 支持，取消下面这行注释：
          # platforms: linux/amd64,linux/arm64/v8
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 利用 GitHub Actions 缓存加速构建
          cache-from: type=gha, scope=${{ github.workflow }}-test
          cache-to: type=gha, mode=max, scope=${{ github.workflow }}-test
          # 构建时传入元数据，便于镜像内查询
          build-args: |
            BUILD_SOURCE=github-actions
            BUILD_REF=${{ github.ref }}
            BUILD_SHA=${{ github.sha }}
            BUILD_TAG=${{ steps.tag.outputs.image_tag }}

      # --------------------------------------------------
      # 7. 输出镜像信息（供后续 job / 通知使用）
      # --------------------------------------------------
      - name: Image info
        run: |
          echo "✅ 测试镜像构建并推送成功"
          echo ""
          echo "📦 镜像标签:"
          echo "   ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}"
          echo "   ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag_with_sha }}"
          echo ""
          echo "🔧 测试命令:"
          echo "   docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}"
          echo "   docker run --rm -it ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}"
          echo ""
          echo "📋 来源: ${{ steps.tag.outputs.suffix }}"
          echo "📝 提交: ${{ steps.tag.outputs.commit_msg }}"
          echo "🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # --------------------------------------------------
      # 8. 在 PR 中评论镜像信息（仅 PR 场景）
      # --------------------------------------------------
      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const imageUrl = `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}`;
            const imageUrlSha = `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag_with_sha }}`;
            const shortSha = `${{ steps.tag.outputs.short_sha }}`;
            const commitMsg = `${{ steps.tag.outputs.commit_msg }}`.trim();
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            const body = [
              `## 🐳 Docker Test Image Ready`,
              ``,
              `**镜像标签**: \`${imageUrl}\``,
              ``,
              `| 标签类型 | 值 |`,
              `|---------|----|`,
              `| 最新测试 | \`${imageUrl}\` |`,
              `| 精确版本 | \`${imageUrlSha}\` |`,
              `| 提交 SHA | \`${shortSha}\` |`,
              `| 提交信息 | ${commitMsg} |`,
              ``,
              `**测试命令**:`,
              '```bash',
              `docker pull ${imageUrl}`,
              `docker run --rm -p 3000:3000 ${imageUrl}`,
              '```',
              ``,
              `**CI 日志**: ${runUrl}`,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
